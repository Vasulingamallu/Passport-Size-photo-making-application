{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Background Removal</h2>
        <a href="{{ url_for('photos.view', photo_id=photo.id) }}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i> Back
        </a>
    </div>
    <div class="row mt-2">
        <div class="col-md-8 mb-4">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-light d-flex justify-content-between align-items-center">
                    <span>Preview</span>
                    <span id="status-badge" class="badge bg-secondary">Original</span>
                </div>
                <div class="card-body text-center" style="background: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAMUlEQVQ4T2NkYGAQYcAP3hKhjIAmHxkYGBiIBYxEAw0DgxGNDcagRmMIDGkMxqBGEwAL0wIR1x07KwAAAABJRU5ErkJggg==') repeat; min-height: 400px; display:flex; align-items:center; justify-content:center;">
                    <img id="bg-preview" src="{{ url_for('photos.serve_image', photo_id=photo.id, image_type='processed' if photo.processed_path else 'original') }}" alt="Preview" class="img-fluid" style="max-height: 400px;">
                </div>
                <div id="processing-overlay" class="d-none position-absolute top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center" style="background:rgba(255,255,255,0.8); z-index:10;">
                    <div class="text-center">
                        <div class="spinner-border text-primary mb-2" role="status"></div>
                        <p class="fw-bold">Removing background… this may take 10–30 seconds</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-light">Background Color</div>
                <div class="card-body">
                    <p class="text-muted small">Select the background color for your passport photo.</p>

                    <div class="d-flex gap-2 mb-3 flex-wrap">
                        <button class="color-btn" data-color="#ffffff" style="background:#ffffff; width:50px; height:50px; border:2px solid #999; border-radius:6px; cursor:pointer;" title="White"></button>
                        <button class="color-btn" data-color="#f0f8ff" style="background:#f0f8ff; width:50px; height:50px; border:2px solid #ccc; border-radius:6px; cursor:pointer;" title="Alice Blue"></button>
                        <button class="color-btn" data-color="#e6e6fa" style="background:#e6e6fa; width:50px; height:50px; border:2px solid #ccc; border-radius:6px; cursor:pointer;" title="Lavender"></button>
                        <button class="color-btn" data-color="#d3d3d3" style="background:#d3d3d3; width:50px; height:50px; border:2px solid #ccc; border-radius:6px; cursor:pointer;" title="Light Grey"></button>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Custom Color</label>
                        <input type="color" class="form-control form-control-color w-100" id="customColor" value="#ffffff">
                    </div>

                    <div class="mb-2 p-2 rounded border text-center">
                        Selected: <strong id="selected-color-label">#ffffff</strong>
                        <span id="color-swatch" style="display:inline-block; width:20px; height:20px; background:#ffffff; border:1px solid #999; border-radius:3px; vertical-align:middle; margin-left:6px;"></span>
                    </div>

                    <button id="apply-btn" class="btn btn-primary w-100 mb-2">
                        <i class="bi bi-magic"></i> Remove & Apply Background
                    </button>
                    <a id="download-btn" href="{{ url_for('downloads.download_photo', photo_id=photo.id) }}" class="btn btn-success w-100 d-none">
                        <i class="bi bi-download"></i> Download Result
                    </a>
                    <a href="{{ url_for('photos.enhance', photo_id=photo.id) }}" class="btn btn-outline-primary w-100 mt-2">
                        Next: Enhance <i class="bi bi-arrow-right"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const photoId = {{ photo.id }};
    const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
    let selectedColor = '#ffffff';

    function setColor(hex) {
        selectedColor = hex;
        document.getElementById('selected-color-label').textContent = hex;
        document.getElementById('color-swatch').style.background = hex;
        document.getElementById('customColor').value = hex;
    }

    document.querySelectorAll('.color-btn').forEach(btn => {
        btn.addEventListener('click', () => setColor(btn.dataset.color));
    });

    document.getElementById('customColor').addEventListener('input', function() {
        setColor(this.value);
    });

    document.getElementById('apply-btn').addEventListener('click', function() {
        const btn = this;
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Processing...';

        fetch(`/process/${photoId}/remove-background`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrfToken
            },
            body: JSON.stringify({ bg_color: selectedColor })
        })
        .then(r => r.json())
        .then(data => {
            if (data.success) {
                // Reload the processed image preview
                document.getElementById('bg-preview').src =
                    `/photos/${photoId}/image/processed?t=` + Date.now();
                document.getElementById('status-badge').textContent = 'Background Removed';
                document.getElementById('status-badge').className = 'badge bg-success';
                document.getElementById('download-btn').classList.remove('d-none');
            } else {
                alert('Error: ' + (data.error || 'Unknown error'));
            }
        })
        .catch(err => alert('Request failed: ' + err.message))
        .finally(() => {
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-magic"></i> Remove & Apply Background';
        });
    });
});
</script>
{% endblock %}
