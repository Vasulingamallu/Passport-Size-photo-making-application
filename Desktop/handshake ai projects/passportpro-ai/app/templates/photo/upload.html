{% extends "base.html" %}

{% block title %}Upload Photo{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h2 class="mb-4">Upload Photo</h2>
            
            <div id="drop-zone" class="p-5 text-center bg-light border border-2 border-dashed rounded" style="cursor: pointer;">
                <i class="bi bi-cloud-arrow-up display-1 text-secondary mb-3"></i>
                <h4>Drag & drop your photo here or click to browse</h4>
                <p class="text-muted mt-2">Supported formats: JPG, JPEG, PNG, HEIC &mdash; Max 20MB</p>
                <input type="file" id="file-input" class="d-none" accept=".jpg,.jpeg,.png,.heic">
            </div>

            <div id="preview-area" class="mt-4 d-none">
                <div class="card">
                    <div class="card-body">
                        <div class="row align-items-center">
                            <div class="col-md-4 text-center">
                                <img id="image-preview" src="" class="img-thumbnail" alt="Preview" style="max-height: 200px;">
                            </div>
                            <div class="col-md-8 mt-3 mt-md-0">
                                <h5 id="file-name" class="card-title"></h5>
                                <p class="card-text text-muted">
                                    <span id="file-size"></span> &bull; 
                                    <span id="file-dimensions"></span>
                                </p>
                                <div id="error-message" class="text-danger mb-3 d-none"></div>
                                <div id="progress-container" class="mb-3 d-none">
                                    <div class="progress">
                                        <div id="upload-progress" class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%"></div>
                                    </div>
                                </div>
                                <div class="d-flex gap-2">
                                    <button id="upload-btn" class="btn btn-primary">Upload Photo</button>
                                    <button id="cancel-btn" class="btn btn-outline-secondary">Cancel</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="mt-4 text-center">
                <a href="{{ url_for('photos.camera') }}" class="text-decoration-none">
                    <i class="bi bi-camera me-1"></i> Or take a photo with your camera
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/upload.js') }}"></script>
{% endblock %}
