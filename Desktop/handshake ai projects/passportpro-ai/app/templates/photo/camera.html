{% extends "base.html" %}

{% block title %}Capture Photo{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <h2 class="mb-3 text-center">Capture Photo</h2>
            <p class="text-center text-muted mb-4">Look straight at the camera. Keep your face centered.</p>
            
            <div id="camera-container" class="position-relative bg-dark rounded overflow-hidden" style="aspect-ratio: 3/4; width: 100%; max-width: 450px; margin: 0 auto;">
                <video id="camera-video" class="w-100 h-100 object-fit-cover" autoplay playsinline></video>
                
                <!-- Oval guide overlay -->
                <div class="position-absolute top-0 start-0 w-100 h-100 d-flex justify-content-center align-items-center" style="pointer-events: none;">
                    <div style="width: 60%; height: 60%; border: 2px dashed rgba(255,255,255,0.7); border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; box-shadow: 0 0 0 9999px rgba(0,0,0,0.5);"></div>
                </div>
                <div class="position-absolute bottom-0 w-100 text-center pb-3 text-white" style="pointer-events: none; text-shadow: 1px 1px 3px rgba(0,0,0,0.8);">
                    <small>Position your face inside the oval</small>
                </div>
            </div>
            
            <div id="preview-container" class="d-none text-center" style="max-width: 450px; margin: 0 auto;">
                <img id="photo-preview" class="img-fluid rounded border shadow-sm" alt="Captured photo">
            </div>
            
            <!-- Hidden Canvas -->
            <canvas id="photo-canvas" class="d-none"></canvas>
            
            <div id="error-message" class="alert alert-danger mt-3 d-none"></div>

            <div class="d-flex justify-content-center align-items-center gap-4 mt-4" id="camera-controls">
                <button id="switch-camera-btn" class="btn btn-outline-secondary rounded-circle p-3">
                    <i class="bi bi-arrow-repeat fs-4"></i>
                </button>
                <button id="capture-btn" class="btn btn-primary rounded-circle" style="width: 70px; height: 70px; padding: 0; border: 4px solid #fff; box-shadow: 0 0 0 2px var(--bs-primary);">
                </button>
                <a href="{{ url_for('photos.upload') }}" class="btn btn-outline-secondary rounded-circle p-3">
                    <i class="bi bi-x-lg fs-4"></i>
                </a>
            </div>
            
            <div class="d-flex justify-content-center gap-3 mt-4 d-none" id="preview-controls">
                <button id="retake-btn" class="btn btn-secondary px-4">Retake</button>
                <button id="use-photo-btn" class="btn btn-primary px-4">Use Photo</button>
            </div>
            
            <div class="mt-4 text-center">
                <a href="{{ url_for('photos.upload') }}" class="text-decoration-none">
                    <i class="bi bi-upload me-1"></i> Prefer to upload a file?
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const captureUrl = "{{ url_for('photos.capture') }}";
</script>
<script src="{{ url_for('static', filename='js/camera.js') }}"></script>
{% endblock %}
