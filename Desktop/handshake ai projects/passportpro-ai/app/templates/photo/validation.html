{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Photo Validation</h2>
        <a href="{{ url_for('photos.view', photo_id=photo.id) }}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i> Back
        </a>
    </div>
    <div class="row mt-2">
        <div class="col-md-5 mb-4 text-center">
            <div class="card shadow-sm h-100">
                <div class="card-body d-flex flex-column align-items-center justify-content-center p-4">
                    <img src="{{ url_for('photos.serve_image', photo_id=photo.id, image_type='processed' if photo.processed_path else 'original') }}" alt="Preview" class="img-fluid rounded mb-4" style="max-height: 250px;">

                    <div id="score-circle" style="width:150px; height:150px; border-radius:50%; border:10px solid #6c757d; display:flex; align-items:center; justify-content:center; font-size:3rem; font-weight:bold; color:#6c757d;">
                        —
                    </div>
                    <h4 id="score-label" class="mt-3 fw-bold text-muted">Not validated</h4>
                    <p id="score-hint" class="text-muted small">Click "Validate" to analyse your photo.</p>
                </div>
            </div>
        </div>

        <div class="col-md-7">
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-light">Validation Checklist</div>
                <div class="card-body" id="checklist">
                    <div class="text-center text-muted py-4">
                        <i class="bi bi-shield-check" style="font-size:3rem;"></i>
                        <p class="mt-2">Press <strong>Validate</strong> to run AI checks.</p>
                    </div>
                </div>
            </div>

            <div id="suggestions-card" class="card shadow-sm mb-4 d-none border-warning">
                <div class="card-header bg-warning text-dark">Suggestions</div>
                <div class="card-body">
                    <ul id="suggestions-list" class="mb-0 ps-3"></ul>
                </div>
            </div>

            <div class="d-flex gap-2">
                <button id="validate-btn" class="btn btn-primary flex-grow-1">
                    <i class="bi bi-shield-check"></i> Validate Photo
                </button>
                <a href="{{ url_for('photos.background', photo_id=photo.id) }}" class="btn btn-outline-primary flex-grow-1">
                    Next: Remove Background <i class="bi bi-arrow-right"></i>
                </a>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const photoId = {{ photo.id }};
    const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');

    document.getElementById('validate-btn').addEventListener('click', function() {
        const btn = this;
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Validating...';

        fetch(`/process/${photoId}/validate`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrfToken
            },
            body: JSON.stringify({})
        })
        .then(r => r.json())
        .then(data => {
            if (data.success) {
                renderResults(data.data);
            } else {
                alert('Error: ' + (data.error || 'Validation failed'));
            }
        })
        .catch(err => alert('Request failed: ' + err.message))
        .finally(() => {
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-arrow-clockwise"></i> Re-validate';
        });
    });

    function renderResults(result) {
        const score = result.total_score || 0;
        const circle = document.getElementById('score-circle');
        const label = document.getElementById('score-label');
        const hint = document.getElementById('score-hint');

        let color = '#dc3545';
        if (score >= 90) color = '#28a745';
        else if (score >= 75) color = '#17a2b8';
        else if (score >= 50) color = '#ffc107';

        circle.textContent = score;
        circle.style.borderColor = color;
        circle.style.color = color;
        label.textContent = result.status || 'Unknown';
        label.className = 'mt-3 fw-bold';
        label.style.color = color;
        hint.textContent = '';

        // Render checklist
        const checklist = document.getElementById('checklist');
        checklist.innerHTML = '';
        (result.checks || []).forEach(check => {
            const icon = check.passed
                ? '<i class="bi bi-check-circle-fill text-success me-2"></i>'
                : '<i class="bi bi-x-circle-fill text-danger me-2"></i>';
            const badge = check.passed
                ? '<span class="badge bg-success">Pass</span>'
                : '<span class="badge bg-danger">Fail</span>';

            checklist.innerHTML += `
                <div class="d-flex justify-content-between align-items-center mb-3 p-2 border rounded">
                    <div>
                        <h6 class="mb-0">${icon}${check.name}</h6>
                        <small class="text-muted">${check.message} (${check.score}/${check.max_score})</small>
                    </div>
                    ${badge}
                </div>`;
        });

        // Suggestions
        if (result.suggestions && result.suggestions.length > 0) {
            const suggCard = document.getElementById('suggestions-card');
            const list = document.getElementById('suggestions-list');
            list.innerHTML = result.suggestions.map(s => `<li>${s}</li>`).join('');
            suggCard.classList.remove('d-none');
        }
    }
});
</script>
{% endblock %}
